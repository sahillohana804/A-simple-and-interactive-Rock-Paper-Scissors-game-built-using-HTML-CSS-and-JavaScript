<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Rock Paper Scissors</title>
</head>
<body>

    <h1>Rock Paper Scissors</h1>

    <div class="choices">

        <button class="choice" id="rock">
            🪨
            <p>Rock</p>
        </button>

        <button class="choice" id="paper">
            📄
            <p>Paper</p>
        </button>

        <button class="choice" id="scissors">
            ✂️
            <p>Scissors</p>
        </button>

    </div>

    <div class="result-container">
        <h2 id="result">Choose your move!</h2>
        <p id="computer-choice">Computer Choice: -</p>
    </div>

    <div class="score-board">

        <div class="score">
            <p>You</p>
            <h2 id="user-score">0</h2>
        </div>

        <div class="score">
            <p>Computer</p>
            <h2 id="computer-score">0</h2>
        </div>

        <div class="score">
            <p>Draw</p>
            <h2 id="draw-score">0</h2>
        </div>

    </div>

    <button id="reset-btn">Reset Game</button>

    <script src="ap.js"></script>

</body>
</html>
